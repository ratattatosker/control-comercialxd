workflows:
  control-comercial-android-apk:
    name: Control Comercial - APK Android
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: "3.50.1"
      java: 17

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper/dists

    scripts:
      - name: Verify build kit uploaded to GitHub
        script: |
          set -euo pipefail
          KIT_ARCHIVE="$CM_BUILD_DIR/Control_Comercial_Codemagic_Kit_v2.zip"
          test -s "$KIT_ARCHIVE"
          unzip -tq "$KIT_ARCHIVE" >/dev/null
          echo "Build kit exists and its ZIP integrity check passed."

      - name: Extract and verify build kit and Flutter source
        script: |
          set -euo pipefail
          KIT_DIR="$CM_BUILD_DIR/kit"
          SOURCE_DIR="$CM_BUILD_DIR/source"
          mkdir -p "$KIT_DIR" "$SOURCE_DIR"
          unzip -q "$CM_BUILD_DIR/Control_Comercial_Codemagic_Kit_v2.zip" -d "$KIT_DIR"

          test -s "$KIT_DIR/SHA256SUMS.txt"
          (
            cd "$KIT_DIR"
            shasum -a 256 -c SHA256SUMS.txt
          )

          if ! cmp -s "$CM_BUILD_DIR/codemagic.yaml" "$KIT_DIR/codemagic.yaml"; then
            echo "El codemagic.yaml de la raíz no coincide byte por byte con el incluido en el kit." >&2
            exit 1
          fi

          APP_ZIP="$KIT_DIR/Control_Comercial_Android_v0.9.6_Codemagic.zip"
          test -s "$APP_ZIP"
          unzip -tq "$APP_ZIP" >/dev/null
          unzip -q "$APP_ZIP" -d "$SOURCE_DIR"

          APP_DIR="$SOURCE_DIR/Control_Comercial_Android_v0.9.6"
          test -s "$APP_DIR/pubspec.yaml"
          test -s "$APP_DIR/analysis_options.yaml"
          test -s "$APP_DIR/assets/catalog_seed.json"
          test -s "$APP_DIR/lib/data/catalog_seeder.dart"
          test -s "$APP_DIR/lib/data/app_database.dart"
          test -s "$APP_DIR/lib/ui/screens/catalog_screen.dart"
          test -s "$APP_DIR/lib/ui/screens/first_cycle_screen.dart"
          test -s "$APP_DIR/tool/bootstrap_android.sh"
          test -s "$APP_DIR/tool/bootstrap_android.ps1"
          test -s "$APP_DIR/tool/check_dart_delimiters.py"
          test -s "$APP_DIR/tool/verify_reference_rules.py"
          test -s "$APP_DIR/packages/business_core/test/core_logic_test.dart"
          test -s "$APP_DIR/packages/business_core/test/reconciliation_test.dart"

          grep -Fq 'material_ui: 1.11.1' "$APP_DIR/pubspec.yaml"
          grep -Fq 'drift: 2.35.4' "$APP_DIR/pubspec.yaml"
          grep -Fq 'path_provider: 2.1.5' "$APP_DIR/pubspec.yaml"
          grep -Fq 'file_picker: 13.3.3' "$APP_DIR/pubspec.yaml"
          grep -Fq 'drift_dev: 2.35.3' "$APP_DIR/pubspec.yaml"
          grep -Fq 'build_runner: 2.10.4' "$APP_DIR/pubspec.yaml"
          grep -Fq 'test: 1.28.0' "$APP_DIR/pubspec.yaml"
          grep -Fq 'flutter_lints: 6.0.0' "$APP_DIR/pubspec.yaml"
          grep -Fq 'test: 1.28.0' "$APP_DIR/packages/business_core/pubspec.yaml"
          grep -Fq 'dart fix --apply --code=curly_braces_in_flow_control_structures' "$APP_DIR/tool/bootstrap_android.sh"
          grep -Fq 'flutter analyze --fatal-warnings' "$APP_DIR/tool/bootstrap_android.sh"
          grep -Fq 'dart analyze --fatal-warnings' "$APP_DIR/tool/bootstrap_android.sh"
          grep -Fq "'fix', '--apply', '--code=curly_braces_in_flow_control_structures'" "$APP_DIR/tool/bootstrap_android.ps1"
          grep -Fq "@('analyze', '--fatal-warnings')" "$APP_DIR/tool/bootstrap_android.ps1"
          if grep -F -q -- '--fatal-infos' "$APP_DIR/tool/bootstrap_android.sh" "$APP_DIR/tool/bootstrap_android.ps1"; then
            echo "No se debe bloquear CI por diagnósticos informativos; warnings y errores sí son fatales." >&2
            exit 1
          fi
          if grep -R -E -q "package:flutter/(material|cupertino)\.dart" "$APP_DIR/lib" "$APP_DIR/packages"; then
            echo "Quedan imports deprecados de package:flutter/material.dart o cupertino.dart." >&2
            exit 1
          fi
          bash -n "$APP_DIR/tool/bootstrap_android.sh"
          grep -Fq 'version: 0.9.6+15' "$APP_DIR/pubspec.yaml"
          grep -Fq "static const _catalogVersion = '5'" "$APP_DIR/lib/data/catalog_seeder.dart"
          grep -Fq 'Future<void> deleteProduct(String productId)' "$APP_DIR/lib/data/app_repository.dart"
          grep -Fq 'is_deleted = 0' "$APP_DIR/lib/data/app_repository.dart"
          grep -Fq 'getInitialInventoryDefaults()' "$APP_DIR/lib/ui/screens/first_cycle_screen.dart"
          grep -Fq 'Admite fracciones' "$APP_DIR/lib/ui/screens/first_cycle_screen.dart"
          grep -Fq 'flutter: "3.50.1"' "$KIT_DIR/codemagic.yaml"

          python3 - "$APP_DIR/assets/catalog_seed.json" <<'PY'
          import json, sys
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          products = data.get('products')
          if not isinstance(products, list):
              raise SystemExit('El catálogo inicial debe ser una lista JSON, incluso si el usuario decide dejarla vacía.')
          names = [item.get('name', '').strip() for item in products]
          ids = [item.get('id', '').strip() for item in products]
          if any(not value for value in names + ids):
              raise SystemExit('El catálogo contiene nombres o IDs vacíos.')
          if len(set(name.casefold() for name in names)) != len(names):
              raise SystemExit('El catálogo contiene nombres duplicados.')
          if len(set(ids)) != len(ids):
              raise SystemExit('El catálogo contiene IDs duplicados.')
          if [item.get('sortOrder') for item in products] != list(range(len(products))):
              raise SystemExit('El orden del catálogo no es secuencial.')
          for item in products:
              try:
                  quantity = Decimal(str(item['initialQuantity']))
              except (KeyError, InvalidOperation):
                  raise SystemExit(f"Cantidad inicial no válida para {item.get('name', '?')}.")
              if not quantity.is_finite() or quantity < 0:
                  raise SystemExit(f"Cantidad inicial no válida para {item['name']}.")
          print(f'Catálogo inicial válido: {len(products)} artículos; sin límite fijo de cantidad.')
          PY

          echo "Checksums, workflow consistency, Flutter sources, SDK constraints and strict analyzer policy verified."

      - name: Generate Android, run checks and build release APK
        script: |
          set -euo pipefail
          APP_DIR="$CM_BUILD_DIR/source/Control_Comercial_Android_v0.9.6"
          cd "$APP_DIR"
          bash tool/bootstrap_android.sh --build-apk

      - name: Verify APK
        script: |
          set -euo pipefail
          APK="$CM_BUILD_DIR/source/Control_Comercial_Android_v0.9.6/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          ls -lh "$APK"

    artifacts:
      - source/Control_Comercial_Android_v0.9.6/build/app/outputs/flutter-apk/app-release.apk
      - source/Control_Comercial_Android_v0.9.6/pubspec.lock
      - source/Control_Comercial_Android_v0.9.6/packages/business_core/pubspec.lock
