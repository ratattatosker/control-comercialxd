workflows:
  control-comercial-android-apk:
    name: Cafetería Rubí - APK Android
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: "3.50.1"
      java: 17

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper/dists

    scripts:
      - name: Verify and extract the current build kit
        script: |
          set -euo pipefail
          KIT_ARCHIVE="$CM_BUILD_DIR/Control_Comercial_Codemagic_Kit_v2.zip"
          KIT_DIR="$CM_BUILD_DIR/kit"
          SOURCE_DIR="$CM_BUILD_DIR/source"

          test -s "$KIT_ARCHIVE"
          unzip -tq "$KIT_ARCHIVE" >/dev/null
          mkdir -p "$KIT_DIR" "$SOURCE_DIR"
          unzip -q "$KIT_ARCHIVE" -d "$KIT_DIR"

          test -s "$KIT_DIR/SHA256SUMS.txt"
          (
            cd "$KIT_DIR"
            shasum -a 256 -c SHA256SUMS.txt
          )

          if ! cmp -s "$CM_BUILD_DIR/codemagic.yaml" "$KIT_DIR/codemagic.yaml"; then
            echo "El codemagic.yaml del repositorio no coincide con el incluido en el kit." >&2
            exit 1
          fi

          APP_ZIP="$KIT_DIR/Control_Comercial_Android_v0.9.6_Codemagic.zip"
          test -s "$APP_ZIP"
          unzip -tq "$APP_ZIP" >/dev/null
          unzip -q "$APP_ZIP" -d "$SOURCE_DIR"

          APP_DIR="$SOURCE_DIR/Control_Comercial_Android_v0.9.6"
          test -s "$APP_DIR/pubspec.yaml"
          test -s "$APP_DIR/packages/business_core/pubspec.yaml"
          test -s "$APP_DIR/assets/catalog_seed.json"
          test -s "$APP_DIR/lib/data/catalog_seeder.dart"
          test -s "$APP_DIR/lib/data/app_database.dart"
          test -s "$APP_DIR/lib/data/app_repository.dart"
          test -s "$APP_DIR/lib/services/backup_service.dart"
          test -s "$APP_DIR/packages/business_core/lib/services/calculation_service.dart"
          test -s "$APP_DIR/packages/business_core/test/core_logic_test.dart"
          test -s "$APP_DIR/packages/business_core/test/reconciliation_test.dart"
          test -s "$APP_DIR/tool/bootstrap_android.sh"
          test -s "$APP_DIR/tool/ensure_android_sdk.py"
          test -s "$APP_DIR/tool/verify_android_application_id.py"
          test -s "$APP_DIR/tool/verify_reference_rules.py"

          grep -Fq 'version: 0.9.6+51' "$APP_DIR/pubspec.yaml"
          grep -Fq "sdk: '>=3.11.0 <4.0.0'" "$APP_DIR/pubspec.yaml"
          grep -Fq 'exact_decimal_report_precision_v1' "$APP_DIR/lib/data/catalog_seeder.dart"
          grep -Fq 'historical_report_recalculated_with_exact_decimal_precision' "$APP_DIR/lib/data/catalog_seeder.dart"
          grep -Fq 'signingConfig = signingConfigs.getByName("debug")' "$APP_DIR/tool/bootstrap_android.sh"
          grep -Fq 'dart analyze --fatal-warnings' "$APP_DIR/tool/bootstrap_android.sh"
          grep -Fq 'dart test' "$APP_DIR/tool/bootstrap_android.sh"
          grep -Fq 'flutter build apk --release' "$APP_DIR/tool/bootstrap_android.sh"

          python3 - "$APP_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          data = json.loads((root / 'assets/catalog_seed.json').read_text(encoding='utf-8'))
          if not isinstance(data.get('products'), list):
              raise SystemExit('catalog_seed.json no contiene una lista products válida.')
          print(f"Proyecto extraído: Cafetería Rubí 0.9.6+51; {len(data['products'])} productos semilla.")
          PY

          echo "Kit y fuente actual verificados. No se necesita un keystore privado: release usa firma debug."

      - name: Run project checks and build the release APK
        script: |
          set -euo pipefail
          APP_DIR="$CM_BUILD_DIR/source/Control_Comercial_Android_v0.9.6"
          cd "$APP_DIR"
          bash tool/bootstrap_android.sh --build-apk

      - name: Verify APK identity, alignment and signature
        script: |
          set -euo pipefail
          APP_DIR="$CM_BUILD_DIR/source/Control_Comercial_Android_v0.9.6"
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          AAPT="$BUILD_TOOLS/aapt"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -s "$APK"
          test -x "$AAPT"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          unzip -tq "$APK" >/dev/null
          "$ZIPALIGN" -c -p 4 "$APK"

          PACKAGE_NAME="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          if [[ "$PACKAGE_NAME" != "com.controlcomercial" ]]; then
            echo "applicationId incorrecto en la APK: ${PACKAGE_NAME:-vacío}" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          echo "APK válida: applicationId=$PACKAGE_NAME; release firmado con debug."
          ls -lh "$APK"

    artifacts:
      - source/Control_Comercial_Android_v0.9.6/build/app/outputs/flutter-apk/app-release.apk
      - source/Control_Comercial_Android_v0.9.6/pubspec.lock
      - source/Control_Comercial_Android_v0.9.6/packages/business_core/pubspec.lock
